[project]
name = "elyaeval"
version = "0.1.0"
description = "Starter kit for DeepEval-based CI/CD testing: standard dataset, metric presets, and a pytest-file generator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Exact pin: reporting/tracing_report.py and the DeepEval end_time
    # workaround depend on DeepEval internals that change between releases.
    "deepeval==4.2.0",
    "pytest>=8",
    "tomli>=2; python_version < '3.11'",
]

# Judge-provider SDKs. DeepEval imports these lazily, so install only the
# one(s) your [tool.elyaeval.judge] provider needs, e.g.
#   pip install "elyaeval[anthropic]"
# openai / openai_compatible / azure_openai / deepseek / openrouter / grok
# need no extra (the openai SDK ships with deepeval).
[project.optional-dependencies]
ollama = ["ollama>=0.4"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
bedrock = ["aiobotocore>=2.13", "botocore>=1.34"]
litellm = ["litellm>=1.50"]
xdist = ["pytest-xdist>=3.5"]
dev = [
    "build",
    "pyyaml>=6",
    "mypy>=1.10",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
]

[project.scripts]
elyaeval = "elyaeval.cli:main"

# Auto-registers reporting/plugin.py as a pytest plugin for any environment
# that has this package installed — no conftest.py wiring needed in the
# consuming repo. This is what makes HTML reports + per-metric averages
# appear automatically at the end of `pytest`/`deepeval test run`, for
# every generated test file, just by bumping the elyaeval version pin.
[project.entry-points.pytest11]
elyaeval = "elyaeval.reporting.plugin"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["elyaeval*"]

[tool.setuptools.package-data]
elyaeval = [
    "templates/*.tmpl",
    "standard_dataset/*.jsonl",
    "reporting/report_theme.css",
    "recipes/tekton/*.yaml",
    "recipes/tekton/*.md",
    "recipes/docker/*.Dockerfile",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines in docstrings/help text are fine; B008: argparse-style defaults;
# UP007/UP045: Optional[X] is kept (existing style), not mass-rewritten to X | None
ignore = ["E501", "B008", "UP007", "UP045"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["elyaeval"]
ignore_missing_imports = true
warn_unused_ignores = true
